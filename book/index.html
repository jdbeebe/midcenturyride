<style>
/* Flipbook core: 3D leaves hinged on the left (x) or top (y) edge. */
@property --a { syntax: '<number>'; inherits: true; initial-value: 0; }

.fb {
  position: relative;
  perspective: 2000px;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.fb-y { touch-action: none; perspective: 1600px; }

.fb-stage {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform .7s cubic-bezier(.25, .8, .25, 1);
}
/* A closed book sits centred: shift by half a page at the covers. */
.fb-x.fb-spread.fb-at-start .fb-stage { transform: translateX(-25%); }
.fb-x.fb-spread.fb-at-end .fb-stage { transform: translateX(25%); }

.fb-leaf {
  position: absolute;
  transform-style: preserve-3d;
  will-change: transform;
}
.fb-x .fb-leaf { top: 0; bottom: 0; left: 0; width: 100%; transform-origin: left center; }
.fb-x.fb-spread .fb-leaf { left: 50%; width: 50%; }
.fb-y .fb-leaf { left: 0; right: 0; top: 0; height: 100%; transform-origin: center top; }
.fb-y.fb-spread .fb-leaf { top: 50%; height: 50%; }
.fb-far { visibility: hidden; }
/* At rest, fully hide the side of each leaf that faces away. backface-visibility only hides
   it visually; it still catches scroll and touch gestures meant for the visible page. */
.fb-leaf:not(.fb-lifted):not(.fb-turned) .fb-back,
.fb-leaf.fb-turned:not(.fb-lifted) .fb-front { visibility: hidden; }
/* Single pages at rest render flat so their contents can scroll on touch devices. */
.fb-rest:not(.fb-spread) .fb-stage,
.fb-rest:not(.fb-spread) .fb-leaf { transform-style: flat; }

.fb-anim {
  transition:
    transform var(--fb-dur, .7s) cubic-bezier(.3, .75, .25, 1),
    --a var(--fb-dur, .7s) cubic-bezier(.3, .75, .25, 1);
}

.fb-face {
  position: absolute;
  inset: 0;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}
.fb-x .fb-back { transform: rotateY(180deg); }
.fb-y .fb-back { transform: rotateX(180deg); }

/* Lighting: the front darkens as it lifts, the back brightens as it lands. */
.fb-face::after {
  content: '';
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 50;
}
.fb-x .fb-front::after { background: linear-gradient(to left, rgba(0,0,0,.55), rgba(0,0,0,.08) 70%, rgba(255,255,255,.06)); opacity: calc(var(--a) * 1.5); }
.fb-x .fb-back::after  { background: linear-gradient(to right, rgba(0,0,0,.5), rgba(0,0,0,.05) 70%); opacity: calc((1 - var(--a)) * 1.5); }
.fb-y .fb-front::after { background: linear-gradient(to top, rgba(0,0,0,.55), rgba(0,0,0,.08) 70%); opacity: calc(var(--a) * 1.5); }
.fb-y .fb-back::after  { background: linear-gradient(to bottom, rgba(0,0,0,.5), rgba(0,0,0,.05) 70%); opacity: calc((1 - var(--a)) * 1.5); }

/* Gutter shadow along the spine in spread mode. */
.fb-spread.fb-x .fb-face::before {
  content: '';
  position: absolute;
  top: 0; bottom: 0; width: 9%;
  pointer-events: none;
  z-index: 49;
}
.fb-spread.fb-x .fb-front::before { left: 0; background: linear-gradient(to right, rgba(0,0,0,.16), transparent); }
.fb-spread.fb-x .fb-back::before  { right: 0; background: linear-gradient(to left, rgba(0,0,0,.16), transparent); }

/* A lifted leaf casts a soft shadow. */
.fb-lifted .fb-face { box-shadow: 0 0 40px rgba(0,0,0,.25); }

.fb-jump .fb-leaf { transition: none !important; }

@media (prefers-reduced-motion: reduce) {
  .fb-anim { --fb-dur: .01s !important; }
}

window.HOMES = [
  { order: 1, name: "Irwin Pool House", architect: "Landis Gores", visit: "Stop", address: "843 Weed Street", year: 1960, surveyId: 31, surveyPage: 143,
    notes: "Designed by architect Landis Gores in 1960 as a pool house for Jane and John Irwin. Jane was the daughter of IBM Founder Thomas Watson. Landis Gores grew up in the Midwest and graduated summa cum laude from Princeton in 1939, before continuing his education at Harvard. There he became close with fellow student Philip Johnson and professor Marcel Breuer. All later become members of the Harvard Five modern architectural group along with John Johansen and Eliot Noyes. In the Second World War Gores took part in a top-secret operation known as Ultra, which broke the code of the German high command. By the time he completed active duty he had been awarded both the Legion of Merit and the Order of the British Empire. After WW2 he worked with Philip Johnson where Johnson would design, and Gores would draft ideas to a polished resolved result. Gores helped Johnson on Early Miesian-inspired (Mies Van Der Rohe) houses which included the Booth House, the Rockefeller townhouse, the MOMA garden, and the famous Glass House. Upon complaints that Johnson had not yet passed his New York architectural exam and therefore could not practice in New York state, the two left their office in New York City and relocated their practice to New Canaan, Connecticut. In 1951 Johnson and Gores parted professionally, and on November 1 Gores opened his own architectural practice. Three years later, Gores was stricken with polio. It was just a year before the US government approved the distribution of the polio vaccine. Gores was initially confined to an iron lung and for the rest of his life and doctors informed him that his physical activities would be severely restricted. Nevertheless, he slowly began to resume his work with the help of close friend John Irwin who fashioned Gores a special electric typewriter so that he would be able to continue his architectural career." },
  { order: 2, name: "Irwin House", architect: "Victor Christ-Janer", visit: "Ride by", address: "237 Wahackme Road", year: 1954, surveyId: 8, surveyPage: 57,
    notes: "The Irwin House was almost certainly one of the houses referred to in a January 1953 article in House & Home, in which Victor Christ-Janer remarked that he had convinced Roles to construct two Modern speculative houses on Wahackme Road, and Roles responded, “I now think we can do a good modern speculative house in this area. I don’t care whether it has a flat roof or not; give me the plans of a house that makes sense and I’ll build it” (House & Home, January 1953, 137). A fire in 1972 caused substantial damage to the house, but it was rebuilt following the original plans. Alterations were made in the 1980s to the house’s porches and balcony." },
  { order: 3, name: "Techbuilt / Swallen House", architect: "Carl Koch", visit: "Ride by", address: "257 Wahackme Road", year: 1954, surveyId: 45, surveyPage: 197,
    notes: "The Techbuilt House/Swallen House is situated on a heavily wooded lot, which runs north-to-south on the north side of a hill. The lot slopes upwards towards the west and north. The hill has been terraced to fit the house, patio, and play area. The exterior design of the Techbuilt House was characterized by a pitched roof, large plate glass windows on the gable ends, and deep eaves. Koch had determined that the most economical use of space was achieved by a two-story plan that was essentially an “attic” with high side walls stacked on a partially recessed “basement,” allowing for adequate light and ventilation at both levels. The shell of the house was composed of stress skinned panels on a four-foot-wide module. The main entrance could be located either at the gable ends or on the side walls, depending on how the building was situated to the street. The utility core and stairs were located at the core of the house to allow for flexible use of the interior spaces. The pre-fabricated shell of the house, which included wall panels, end panels, floor panels, roof panels, and beams, girders, and trim, was designed for shipment in a single truckload delivery to a site with a prepared foundation. Once on site, four men could unload the components, frame the house, and roof it within two days. All of the finishing work could then be completed inside. The primary cost savings were created through the delivery method and fast pace of construction. The Techbuilt House could be customized to different sizes and floor plans and allowed owners to finish the interiors to individual taste and budget." },
  { order: 4, name: "Beaven Mills House", architect: "William Pedersen", visit: "Stop", address: "31 Chichester Road", year: 1956, surveyId: 63, surveyPage: 269,
    notes: "Architect William Pedersen was a prolific architect, with a B.Arch. '61 from University of Minnesota, a Master of Architecture from Massachusetts Institute of Technology, recipient of the Rome Prize in Architecture in 1965 (IM Pei sat on jury), elected member of the National Academy and seven time recipient of the AIA National Honor Award. One of the founding Partners of Kohn Pedersen Fox, Pedersen is perhaps best known today for soaring skyscrapers in Asia. The Beaven Mills House is a single-story, flat-roofed house with an irregular plan set on a sloping, wooded site designed by Pedersen when he was just 18 years old and before he had even earned his degree in architecture. It is one of the first modern houses built on Chichester Road." },
  { order: 5, name: "Lee House 2", architect: "John Black Lee", visit: "Stop", address: "202 Chichester Road", year: 1956, surveyId: 49, surveyPage: 213,
    notes: "John Black Lee's college years at Brown University were interrupted by service in the US Navy. Returning after the war he graduated and joined Eliot Noyes' firm in New Canaan before opening his own office. Lee House 2 was designed by John Black Lee for his family after they had outgrown their first house on Laurel Road, acquiring the lot in 1955. The house has been featured in several publications, including the New York Times Magazine, Architectural Record, Better Homes and Gardens, and House & Home. In 1959, Lee House 2 won an award of merit from the American Institute of Architects." },
  { order: 6, name: "Parsons House", architect: "Hugh Smallen", visit: "Ride by", address: "188 Chichester Road", year: 1964, surveyId: 73, surveyPage: 309,
    notes: "Sited on top of a rock ledge forty feet above street level on a three-acre woodland site, the Parsons House is clad and framed in wood, and supported by eight exterior thin steel columns set in concrete footings. Architect Hugh Smallen enhanced the parcel’s dramatic grade changes in both the siting of the house and its design. Although the footprint of the house is square and its roof is flat, the base of the house is angled to match the grade change of the rock ledge it straddles, resulting in two stories at one end of the house and one story on grade at the opposite side of the house. Stone stairs lead up from the driveway at street level to the entrance of the house." },
  { order: 7, name: "Smallen House", architect: "Hugh Smallen", visit: "Ride by", address: "160 Chichester Road", year: 1957, surveyId: 70, surveyPage: 297,
    notes: "Designed by architect Hugh Smallen for his family and completed in 1957. The Smallen House was part of a Modern enclave along Chichester Road. The Smallen House is set in a clearing on a gently sloping wooded site. The one-story house is simply finished with flush vertical wood siding painted white, large fixed sash, and flush doors. Geometric in its design, the shed-roofed house is sited to provide one floor of fenestration at its lowest pitch, and two floors of fenestration at its highest pitch. The main entrance is at the slope of the roof and consists of a flush door flanked by fixed sidelights and an irregularly shaped transom that follows the line of the low-pitched shed roof. The entrance is accessed by a wood deck anchored at one end by a mortared stone wall that bridges the slope at the front of the house." },
  { order: 8, name: "Becker House", architect: "Hugh Smallen", visit: "Ride by", address: "136 Chichester Road", year: 1963, surveyId: 72, surveyPage: 305,
    notes: "The Becker House is set on a hillside overlooking a pond and stream. The street-facing façade of the house is sheltered by a high fieldstone wall. The main entrance is through a narrow opening in the fieldstone wall which leads to a secluded courtyard with a pergola roof. A carport is located adjacent to the courtyard, also behind the stone wall. The main part of the house is rectangular in plan. At the lower level of the hill, the house is two stories high; this rear wall is heavily glazed. A wood deck extends across the back of the house. The house is clad in flush vertical wood siding, which contrasts with the heavy stone wall and stone base of the building." },
  { order: 9, name: "Gratwick House", architect: "Victor Christ-Janer", visit: "Ride by", address: "53 Myanos Road", year: 1953, surveyId: 7, surveyPage: 53,
    notes: "The Gratwick House was designed by Victor Christ-Janer and constructed in 1953. Christ-Janer acquired the property from builder Robert Roles in 1952 and may have designed the dwelling as a speculative house. Although no builder is specifically identified, the house was likely constructed by Roles, who worked with Christ-Janer on a number of projects in New Canaan. The appearance has been significantly changed by alterations over the years." },
  { order: 10, name: "Blod / Roles House", architect: "Victor Christ-Janer", visit: "Ride by", address: "383 Wahackme Road", year: 1953, surveyId: 6, surveyPage: 49,
    notes: "Christ-Janer’s plan for the house clustered utility spaces at the core of the rectangular footprint and moved living and sleeping uses to the perimeter to take advantage of the natural light from the window walls. An interior terrace with a reflecting pool and rolling partition storage walls were also character-defining features for this highly individualistic house. The Roles House was one of six houses shown on the 1953 Modern House Tour." },
  { order: 11, name: "Hodgson House", architect: "Johnson & Gores", visit: "Stop", address: "881 Ponus Ridge", year: 1951, surveyId: 36, surveyPage: 161,
    notes: "The Hodgson House was designed for Richard and Geraldine Hodgson by architect Philip Johnson with Landis Gores acting as associate. The engineer on the project was the Eipel Engineering Company and the builder was John Smith. According to Bill Earls, Johnson received the commission for the house after introducing himself to a couple who was looking at the site across the street from his Glass House." },
  { order: 12, name: "Glass House", architect: "Philip Johnson", visit: "Stop", address: "842 Ponus Ridge", year: 1948, surveyId: 35, surveyPage: 157,
    notes: "The Glass House has been called the “signature work” of Philip Johnson. The Glass House may have been derived from the glass Farnsworth House in Plano, Illinois, by Ludwig Mies van der Rohe, which was completed in 1951, two years after the Glass House. Johnson curated an exhibit of Mies's work at the Museum of Modern Art in 1947, featuring a model of the Farnsworth House. It was an important and influential project for Johnson and for modern architecture. The building is an example of minimal structure, geometry, proportion, and the effects of transparency and reflection. The estate includes other buildings designed by Johnson that span his career. It was designated a National Historic Landmark in 1997. It is now owned by the National Trust for Historic Preservation." },
  { order: 13, name: "Mills House 2", architect: "Willis N. Mills", visit: "Stop", address: "1380 Ponus Ridge", year: 1956, surveyId: 69, surveyPage: 293,
    notes: "Mills House 2 was designed by Willis N. Mills, a principal in the architectural firm of Sherwood, Mills & Smith, as his private residence. It was built by Borglum and Meek and completed in 1956. The house received design awards from Architectural Record and the Boston Arts Festival. It was constructed on a rocky slope where many thought it was impossible to build. The uncomplicated geometry of the rectangular floor plans was offset by the diagonal balconies and terraces." },
  { order: 14, name: "Breuer House 2", architect: "Marcel Breuer", visit: "Stop", address: "628 West Road", year: 1951, surveyId: 4, surveyPage: 41,
    notes: "Breuer House 2 was designed by architect Marcel Breuer for his own family after they decided to move from their original house in New Canaan on Sunset Hill Road. Unlike his first house, Breuer’s second house was designed to be grounded rather than floating, and the flat-roofed, one-story structure was clad in fieldstone veneer and glass. The property also had a flat-roofed carport. The house had an U-shaped plan enclosing a courtyard with a flagstone terrace. The plan concentrated the public living spaces (living room and dining room) and master bedroom and bath at one end, the utility spaces (kitchen, utility room, heating room) in the center, and the children’s room, bath, and guest rooms at the other end of the house. As in his first house, Breuer used neutral colors on the interior with splashes of bright color provided by artwork and by painting individual walls primary colors." },
  { order: 15, name: "Isabelle Daine House", architect: "Victor Christ-Janer", visit: "Stop", address: "92 Briscoe Road", year: 1953, surveyId: 9, surveyPage: 61,
    notes: "Victor Christ-Janer designed this modest 1953 house to blend into the surrounding landscape, but its flat roofs, floor-to-ceiling fixed plate glass sash and open-plan are clearly modern. Christ-Janer graduated from Yale with honors in 1940 then served in WWII. He moved to New Canaan CT and in 1955, he created his own firm Elm Street. He taught at Columbia from 1963 to 1977." },
  { order: 16, name: "Landis Gores House", architect: "Landis Gores", visit: "Stop", address: "192 Cross Ridge Road", year: 1948, surveyId: 30, surveyPage: 139,
    notes: "In 1946, Landis Gores purchased a four-acre lot to design and construct his family's first home in New Canaan, considered one of the first modern homes built in New Canaan. It was featured in national publications including a large spread in the January 1952 issue of House & Home and an article in the New York Times Magazine. The Gores House was listed in the National Register of Historic Places in 2002. The nomination states: “The Landis Gores House is significant because it epitomizes the ‘modern’ architecture of post-World War II America...Among the distinguishing characteristics of the type embodied in the Gores House are its flat-roofed single-story form, emphasis on horizontal planes, extensive use of full-height glass walls, informal open plan, the absence of any reference to historical precedence, and a close relationship between the house and its environment. Leavening the International style’s glass-walled austerity with natural wood and stone in the manner of Frank Lloyd Wright, the house was considered avant-garde...when built.” The property is currently still held in the Gores family." },
  { order: 17, name: "Lee House 1", architect: "John Black Lee", visit: "Stop", address: "729 Laurel Road", year: 1952, surveyId: 48, surveyPage: 209,
    notes: "Built in 1952, this is first of several houses John Black Lee designed for his family's use. The house is an excellent expression of minimalist Bauhaus style Modern architecture, and was listed on the National Register of Historic Places in 2010." },
  { order: 18, name: "Naill House", architect: "Evans Woollen III", visit: "Ride by", address: "635 Laurel Road", year: 1954, surveyId: 80, surveyPage: 333,
    notes: "The Naills acquired this property in 1954 partly because Laurel Road was considered less desirable than Oenoke, Ponus, or Smith Ridge. The owner of the land had commissioned Evans Woollen III to design a house for the lot but didn’t like it and refused to pay for the plans. The Naills acquired the property for about $1900 and contacted Woollen to purchase the plans. He had just graduated from Yale University and was working as a caretaker to pay his rent. He assisted the Naills with choosing interior furnishings and was paid an architectural fee of about $1800. Woollen eventually spent his honeymoon at the house." },
  { order: 19, name: "Arlt House", architect: "Evans Woollen III", visit: "Ride by", address: "607 Laurel Road", year: 1954, surveyId: 79, surveyPage: 329,
    notes: "Evans Woollen III had wanted to be an architect since his youth and studied under modern architects Philip Johnson and Louis Kahn at Yale University and trained locally under John M. Johansen. Graduating from Yale School of Architecture in 1952, Woollen apprenticed at Johnson's firm in New Canaan and later opened a solo practice in New Canaan before relocating to Indianapolis. The Arlt House - designed in 1954 - was one of the houses he designed during that solo practice in New Canaan. Some of Woollen's later designs serve as examples of Modernism and Brutalism architectural styles and were built in Indianapolis where he is considered the giant of architecture!" },
  { order: 20, name: "Spotts House", architect: "Richard Henderson", visit: "Ride by", address: "581 Laurel Road", year: 1972, surveyId: 27, surveyPage: 127,
    notes: "The Spotts House was designed in 1972 or much earlier as some believe (property cards missing in New Canaan) by Architect Richard Henderson. In 1997 the house was featured in the movie “The Ice Storm” - directed by Ang Lee - starring Kevin Kline, Joan Allen, Sigourney Weaver and Elijah Wood." },
  { order: 21, name: "Noyes House 2", architect: "Eliot Noyes", visit: "Ride by", address: "210 Country Club Road", year: 1954, surveyId: 59, surveyPage: 253,
    notes: "Noyes House 2 was designed in 1954 by Eliot Noyes. In Noyes’s words, the house is “a fortress on one side and all glass on the other.” The house was among the first to use wall-size sheets of glass to open up the living area into the outside courtyard. Noyes wrote in his 1963 essay in Life magazine, “It is no coincidence that an architect often expresses himself most clearly in a house designed for himself and his family. As an architect, he will have thought a lot about how people could live as opposed to how they do and how by architectural means he could expand the scope and richness of life within the house.”" },
  { order: 22, name: "Lee Ault House", architect: "Eliot Noyes", visit: "Ride by", address: "90 Lambert Road", year: 1956, surveyId: 57, surveyPage: 245,
    notes: "The Ault House (1952) was designed by architect Eliot Noyes for Lee Ault, the editor of Art in America. Noyes designed the house with a glass-walled gallery along an open courtyard to display Ault's extensive art collection. It was featured in the November 1958 issue of Architectural Record." },
  { order: 23, name: "Alice Ball House", architect: "Philip Johnson", visit: "Ride by", address: "523 Oenoke Ridge", year: 1953, surveyId: 38, surveyPage: 169,
    notes: "Philip Johnson designed the Alice Ball house as a modest one-story, two-bedroom home with an offset axial plan, a flat roof, symmetrically arranged terraces with slate paving, and pink stucco wall surfaces relieved by linearly grouped and symmetrically arranged painted entrance ensembles. The entrance ensembles were glazed wood-frame window and door configurations including fixed plate glass windows, glazed narrow-stile doors, fixed or operable transom windows, and screen doors with bronze rails. Skylights above the hall and kitchen provided additional light to interior spaces. A stucco finish chimney projected approximately 3’ from the east end of the north façade." },
  { order: 24, name: "Celanese House", architect: "Edward Durell Stone", visit: "Stop", address: "565 Oenoke Ridge", year: 1959, surveyId: 74, surveyPage: 313,
    notes: "The Celanese Corporation of America commissioned Edward Durell Stone to design the “Celanese House” to showcase the company’s various products during their 1959 promotional program titled “The American Idea.” An article in the September 20, 1959 New York Times suggested the company hired Stone after executives decided that only Stone or Frank Lloyd Wright would be considered for the commission. The home furnishings consultants for the Celanese Corporation, John and Earline Brice, were in charge of interior design and furnishings, and Dunbar furniture by noted designer Edward Wormley was also showcased. The structural engineer on the project was Henry Gorlin, the mechanical engineer was Harold Hecht, and the contractor was New Canaan builder Ted Hobbs, who built several Modern houses in town." },
  { order: 25, name: "Breuer House 1", architect: "Marcel Breuer", visit: "Stop", address: "122 Sunset Hill Road", year: 1947, surveyId: 3, surveyPage: 37,
    notes: "Breuer House 1 was designed by Marcel Breuer for his family in 1947 and was the first house Breuer designed in town. They chose New Canaan in part because Eliot Noyes had chosen New Canaan to live. The house was featured in an eight-page spread in the October 1948 Architectural Record which noted the “irresistible appeal of the cantilever.” Set on a rise overlooking a gently sloping lawn, the property is planted with large ornamental trees including Japanese maples and weeping hemlocks. The house, which has strong horizontal lines, originally featured an upper floor that cantilevered dramatically over the smaller ground-floor base of the building, including a deep corner porch suspended from cables. Currently, the ends of the main façade and the porch are supported by fieldstone walls, minimizing the effect of the overhangs." },
  { order: 26, name: "Bremer House", architect: "Eliot Noyes", visit: "Stop", address: "60 Windrow Lane", year: 1951, surveyId: 56, surveyPage: 241,
    notes: "Nina Bremer reached out to her friend Eliot Noyes, who drew up a conservative plan for a house, thinking that’s what the Bremers wanted. When Nina told him she didn’t think his plans were interesting, Noyes was elated and tore up the plan. Inspired by Le Corbusier’s Villa Savoye, Noyes created the “upside-down house” with a deeply overhanging upper floor supported on thin columns. The house was designed on a modular plan with 11’6” bays. Concrete-filled pipe columns partially supported the roof. The upper floor was zoned into public and private spaces: one half contained the kitchen, living room, and dining room, and the other half contained four bedrooms, a dressing room, and two baths. The lower floor contained the service spaces: an entryway, bedroom, bath, playroom, laundry room, dumbwaiter, and heating room. A partially covered open porch extended across the front of the upper floor with a terrace below. One half of the open porch is a deeper, room-sized volume, open to the sky. The Harvard Five often congregated at the Bremer House for parties." }

<script>
// Shared helpers for every direction. Expects window.HOMES and, optionally, window.HOME_IMAGES.
(function () {
  const ROOT = window.MCR_ROOT || '';
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = (n) => String(n).padStart(2, '0');

  const images = (h) => ((window.HOME_IMAGES || {})[h.order] || []).map((im) => ({ ...im, src: ROOT + im.src }));

  // First sentence or two, trimmed to roughly `max` characters.
  function excerpt(text, max = 220) {
    if (text.length <= max) return text;
    const cut = text.slice(0, max);
    const end = Math.max(cut.lastIndexOf('. '), cut.lastIndexOf('.” '));
    return (end > max * 0.45 ? cut.slice(0, end + 1) : cut.slice(0, cut.lastIndexOf(' ')) + '…');
  }

  // Line drawing of a modern house, used when a home has no photograph yet.
  const FORMS = { 3: 'gable', 7: 'shed', 6: 'stilt', 25: 'cantilever', 26: 'cantilever', 12: 'glass', 13: 'stilt', 14: 'court', 21: 'court' };
  function drawing(h) {
    const kind = FORMS[h.order] || ['flat', 'court', 'glass', 'shed', 'flat'][h.order % 5];
    const mull = (x0, x1, y0, y1, step) => {
      let s = '';
      for (let x = x0 + step; x < x1; x += step) s += `<line x1="${x}" y1="${y0}" x2="${x}" y2="${y1}"/>`;
      return s;
    };
    let body = '';
    switch (kind) {
      case 'gable':
        body = `<path d="M110 230 V150 L200 80 L290 150 V230 Z" class="ph-fill"/><path d="M150 230 V160 L200 120 L250 160 V230" class="ph-glass"/>${mull(150, 250, 140, 230, 25)}<path d="M96 160 L200 72 L304 160"/>`;
        break;
      case 'shed':
        body = `<path d="M90 230 V170 L310 120 V230 Z" class="ph-fill"/><rect x="200" y="150" width="90" height="80" class="ph-glass"/>${mull(200, 290, 150, 230, 30)}<path d="M76 172 L324 116"/>`;
        break;
      case 'cantilever':
        body = `<rect x="150" y="190" width="90" height="40" class="ph-fill"/><rect x="80" y="130" width="250" height="60" class="ph-fill"/><rect x="100" y="140" width="210" height="34" class="ph-glass"/>${mull(100, 310, 140, 174, 30)}<line x1="320" y1="190" x2="320" y2="230"/><line x1="68" y1="130" x2="342" y2="130"/>`;
        break;
      case 'stilt':
        body = `<rect x="110" y="110" width="190" height="70" class="ph-fill"/><rect x="124" y="122" width="162" height="46" class="ph-glass"/>${mull(124, 286, 122, 168, 27)}${[125, 165, 245, 285].map((x) => `<line x1="${x}" y1="180" x2="${x}" y2="${x < 200 ? 230 : 214}"/>`).join('')}<line x1="96" y1="110" x2="314" y2="110"/><path d="M60 230 L230 230 L340 214" class="ph-ground"/>`;
        break;
      case 'court':
        body = `<rect x="70" y="160" width="110" height="70" class="ph-fill"/><rect x="230" y="160" width="100" height="70" class="ph-fill"/><rect x="180" y="185" width="50" height="45" class="ph-glass"/><rect x="84" y="172" width="82" height="58" class="ph-glass"/>${mull(84, 166, 172, 230, 27)}<line x1="56" y1="160" x2="344" y2="160"/>`;
        break;
      case 'glass':
        body = `<rect x="110" y="150" width="180" height="80" class="ph-glass"/>${mull(110, 290, 150, 230, 45)}<rect x="185" y="175" width="30" height="55" class="ph-fill ph-core"/><line x1="104" y1="150" x2="296" y2="150"/><line x1="104" y1="230" x2="296" y2="230"/>`;
        break;
      default:
        body = `<rect x="80" y="160" width="240" height="70" class="ph-fill"/><rect x="150" y="170" width="150" height="60" class="ph-glass"/>${mull(150, 300, 170, 230, 30)}<rect x="96" y="172" width="34" height="58" class="ph-solid"/><line x1="64" y1="160" x2="336" y2="160"/>`;
    }
    return `<svg class="ph" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Drawing of ${esc(h.name)}">
      <circle cx="${300 - (h.order * 37) % 200}" cy="82" r="34" class="ph-sun"/>
      <g class="ph-line">${body}<line x1="30" y1="230" x2="370" y2="230" class="ph-ground"/></g>
    </svg>`;
  }

  // A photo (with credit) or the drawing fallback.
  function hero(h, cls = '') {
    const im = images(h)[0];
    if (!im) return `<figure class="hero hero-drawn ${cls}">${drawing(h)}<figcaption class="credit">Photograph to come</figcaption></figure>`;
    return `<figure class="hero ${cls}"><img src="${esc(im.src)}" alt="${esc(h.name)}, ${esc(h.address)}" loading="lazy" draggable="false" style="object-position:${esc(im.focus || '50% 50%')}"><figcaption class="credit">${esc(im.credit || '')}</figcaption></figure>`;
  }

  // Bicycle mark built from two circles and a frame triangle.
  const bike = (cls = '') => `<svg class="bike ${cls}" viewBox="0 0 120 70" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"><circle cx="26" cy="46" r="20"/><circle cx="94" cy="46" r="20"/><path d="M26 46 L50 18 L82 18 L94 46 M50 18 L60 46 L26 46 M60 46 L82 18 M46 10 H58 M82 18 L78 8 H88"/></g></svg>`;

  const stats = () => {
    const H = window.HOMES;
    const yrs = H.map((h) => h.year);
    return {
      count: H.length,
      stops: H.filter((h) => /stop/i.test(h.visit)).length,
      first: Math.min(...yrs), last: Math.max(...yrs),
      architects: new Set(H.map((h) => h.architect.replace(/\s+/g, ' ').trim())).size,
    };
  };

  const isStop = (h) => /stop/i.test(h.visit);

  // ---------- Ride with GPS route ----------
  // Merge route data into each house: position, mile marker, stop/ride-by (the route wins),
  // where to stop, and the turn-by-turn cues that lead on to the next house.
  const R = window.ROUTE;
  if (R) {
    const H = window.HOMES;
    H.forEach((h, i) => {
      const r = R.houses[h.order];
      if (!r) return;
      Object.assign(h, { lat: r.lat, lng: r.lng, mile: r.mile, ti: r.ti, stopAt: r.stopAt });
      if (r.visit) h.visit = r.visit;
      const nx = H[i + 1] && R.houses[H[i + 1].order];
      h.cuesOut = nx ? nx.cuesIn : R.finishCues;
    });
    // Cumulative miles along the track, for the elevation profile.
    let d = 0;
    R.track.forEach((p, i) => {
      if (i) {
        const q = R.track[i - 1], k = Math.cos(p[0] * Math.PI / 180);
        d += Math.hypot((p[0] - q[0]) * 69.05, (p[1] - q[1]) * 69.05 * k);
      }
      p[3] = d;
    });
  }

  const mi = (m) => (m < 0.1 ? '0.1' : m.toFixed(1)) + ' mi';
  const gmaps = (h) => 'https://www.google.com/maps/search/?api=1&query=' + (h.lat ? `${h.lat},${h.lng}` : encodeURIComponent(`${h.address}, New Canaan, CT`));
  const ARROWS = { 'Left': '←', 'Right': '→', 'Slight Left': '↖', 'Slight Right': '↗', 'Sharp Left': '↙', 'Sharp Right': '↘', 'Uturn': '↩', 'Straight': '↑' };
  const arrow = (t) => ARROWS[t] || '↑';
  // Leg to the next house: distance, the first named turn, and the full cue list.
  function leg(h) {
    const H = window.HOMES, i = H.indexOf(h), nx = H[i + 1];
    const end = nx ? nx.mile : (R ? R.distanceMi : 0);
    const cues = (h.cuesOut || []).filter((c) => /onto/.test(c.text));
    return { next: nx, dist: Math.max(0, end - (h.mile || 0)), cues };
  }

  // Route map as SVG. opts: { cur: order to highlight, labels: bool, pad, w, h }
  function routeMap(opts = {}) {
    if (!R) return '';
    const { cur = null, labels = false, w = 400, h = 520, pad: P = 28, numbers = labels } = opts;
    const lats = R.track.map((p) => p[0]), lngs = R.track.map((p) => p[1]);
    const lat0 = (Math.min(...lats) + Math.max(...lats)) / 2, k = Math.cos(lat0 * Math.PI / 180);
    const x0 = Math.min(...lngs) * k, x1 = Math.max(...lngs) * k, y0 = Math.min(...lats), y1 = Math.max(...lats);
    const s = Math.min((w - 2 * P) / (x1 - x0), (h - 2 * P) / (y1 - y0));
    const ox = (w - (x1 - x0) * s) / 2, oy = (h - (y1 - y0) * s) / 2;
    const X = (lng) => (ox + (lng * k - x0) * s).toFixed(1), Y = (lat) => (oy + (y1 - lat) * s).toFixed(1);
    const path = (pts) => 'M' + pts.map((p) => `${X(p[1])} ${Y(p[0])}`).join('L');
    const H = window.HOMES;
    const c = cur != null ? H.find((x) => x.order === cur) : null;
    let out = `<svg class="rmap" viewBox="0 0 ${w} ${h}" role="img" aria-label="Route map, ${R.distanceMi} miles">`;
    out += `<path class="rm-path" d="${path(R.track)}"/>`;
    if (c && c.ti != null) out += `<path class="rm-done" d="${path(R.track.slice(0, c.ti + 1))}"/>`;
    (R.extras || []).forEach((e) => { out += `<g class="rm-extra"><path d="M${X(e.lng) - 4} ${Y(e.lat) - 4}l8 8m0-8l-8 8"/></g>`; });
    H.forEach((x) => {
      if (x.lat == null) return;
      const here = c && x.order === c.order;
      const cls = `rm-dot ${isStop(x) ? 'rm-stop' : 'rm-by'} ${here ? 'rm-cur' : ''} ${c && x.order < c.order ? 'rm-past' : ''}`;
      out += `<circle class="${cls}" cx="${X(x.lng)}" cy="${Y(x.lat)}" r="${here ? 9 : isStop(x) ? 4.6 : 3.4}" data-goto-house="${x.order}"/>`;
    });
    if (numbers) {
      // Label every house, nudging labels for tight clusters so they don't sit on the line.
      H.forEach((x, i) => {
        if (x.lat == null) return;
        const side = i % 2 ? 1 : -1;
        out += `<text class="rm-lbl" x="${+X(x.lng) + side * 9}" y="${+Y(x.lat) + 3.5}" text-anchor="${side > 0 ? 'start' : 'end'}">${x.order}</text>`;
      });
    }
    out += `<rect class="rm-start" x="${X(R.start.lng) - 5}" y="${Y(R.start.lat) - 5}" width="10" height="10"/>`;
    return out + '</svg>';
  }

  // Elevation profile as SVG.
  function profile(opts = {}) {
    if (!R) return '';
    const { w = 400, h = 70, cur = null } = opts;
    const E = R.track.map((p) => p[2]), lo = Math.min(...E), hi = Math.max(...E), D = R.track[R.track.length - 1][3];
    const X = (d) => (d / D * w).toFixed(1), Y = (e) => (h - 4 - (e - lo) / (hi - lo || 1) * (h - 10)).toFixed(1);
    const line = R.track.map((p, i) => `${i ? 'L' : 'M'}${X(p[3])} ${Y(p[2])}`).join('');
    let out = `<svg class="rprof" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><path class="rp-fill" d="${line}L${w} ${h}L0 ${h}Z"/><path class="rp-line" d="${line}"/>`;
    const c = cur != null && window.HOMES.find((x) => x.order === cur);
    if (c && c.ti != null) out += `<line class="rp-cur" x1="${X(R.track[c.ti][3])}" x2="${X(R.track[c.ti][3])}" y1="0" y2="${h}"/>`;
    return out + '</svg>';
  }

  // Deep links: #house-12 opens that house; directions keep the hash in sync as you turn.
  const hash = {
    read: () => { const m = location.hash.match(/house-(\d+)/); return m ? +m[1] : null; },
    write: (order) => history.replaceState(null, '', order ? `#house-${order}` : location.pathname + location.search),
  };

  hash.initial = hash.read(); // captured before any book layout rewrites the URL

  window.MCR = { esc, pad, images, excerpt, drawing, hero, bike, stats, isStop, mi, gmaps, arrow, leg, routeMap, profile, hash, route: R };
})();
</script>
<script>
/*
 * Flipbook: a stack of 3D leaves you can drag, tap, swipe or key through.
 *
 *   new Flipbook(el, {
 *     pages: [{ html, cls }],      // in reading order
 *     axis: 'x' | 'y',             // hinge on the left edge or the top edge
 *     spread: '(min-width: 960px)',// media query for two-page spreads ('not all' = never)
 *     verso: (leafIndex) => html,  // back of a leaf in single-page mode
 *     onChange: (book) => {},
 *   })
 *
 * In spread mode leaf j carries pages 2j (front) and 2j+1 (back), so the open
 * spread after turning k leaves is pages 2k-1 (left/top) and 2k (right/bottom).
 */
(function () {
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  class Flipbook {
    constructor(el, opts) {
      this.el = el;
      this.o = Object.assign({
        axis: 'x', spread: 'not all', verso: () => '', onChange: () => {},
      }, opts);
      this.pages = opts.pages;
      this.page = 0;
      this.busy = false;
      this.mq = matchMedia(this.o.spread);
      this.mq.addEventListener('change', () => this.build());
      this.build();
      this.bind();
    }

    get n() { return this.leaves.length; }
    get x() { return this.o.axis === 'x'; }

    build() {
      const spread = (this.spread = this.mq.matches);
      const P = this.pages;
      this.el.classList.add('fb', 'fb-' + this.o.axis);
      this.el.classList.toggle('fb-spread', spread);
      this.el.innerHTML = '';
      this.stage = document.createElement('div');
      this.stage.className = 'fb-stage';
      this.el.append(this.stage);

      const pairs = [];
      if (spread) for (let i = 0; i < P.length; i += 2) pairs.push([P[i], P[i + 1], i, i + 1]);
      else P.forEach((p, i) => pairs.push([p, null, i, -1]));

      this.leaves = pairs.map(([f, b, fi, bi], j) => {
        const leaf = document.createElement('div');
        leaf.className = 'fb-leaf';
        leaf.append(this.face(f, 'fb-front', fi, j), this.face(b, 'fb-back', bi, j));
        this.stage.append(leaf);
        return leaf;
      });
      this.k = spread ? Math.ceil(this.page / 2) : this.page;
      this.layout();
    }

    face(p, cls, idx, j) {
      const d = document.createElement('div');
      d.className = 'fb-face ' + cls;
      if (p) {
        d.innerHTML = p.html;
        if (p.cls) d.classList.add(...p.cls.split(' '));
      } else {
        d.innerHTML = this.o.verso(j);
        d.classList.add('fb-verso');
      }
      d.dataset.page = idx;
      return d;
    }

    set(leaf, a) {
      leaf.style.setProperty('--a', a / 180);
      leaf.style.transform = this.x ? `rotateY(${-a}deg)` : `rotateX(${a}deg)`;
      leaf._a = a;
    }

    layout() {
      const { k, n } = this;
      this.leaves.forEach((l, j) => {
        const turned = j < k;
        this.set(l, turned ? 180 : 0);
        l.style.zIndex = turned ? j + 1 : n - j + 1;
        // Single pages: landed leaves sit off-page, so hide them until they are dragged back.
        l.classList.toggle('fb-turned', turned);
        // At rest only the open page(s) are shown; the leaves underneath appear when a turn starts.
        // (Coplanar 3D leaves otherwise intercept scrolling meant for the visible page.)
        l.classList.toggle('fb-far', this.spread ? (j < k - 1 || j > k) : j !== k);
        l.classList.remove('fb-lifted');
        // At rest on single pages, drop the 3D transform so the page can scroll natively
        // (iOS Safari won't reliably scroll content inside a 3D-transformed layer).
        if (!this.spread && j >= k) l.style.transform = 'none';
      });
      this.el.classList.add('fb-rest');
      this.el.classList.toggle('fb-at-start', k === 0);
      this.el.classList.toggle('fb-at-end', k === n);
      this.page = this.spread ? Math.max(0, 2 * k - 1) : k;
      this.o.onChange(this);
    }

    lift(leaf) {
      this.el.classList.remove('fb-rest');
      if (leaf.style.transform === 'none') this.set(leaf, leaf._a ?? 0);
      leaf.style.zIndex = this.n + 5;
      const j = this.leaves.indexOf(leaf);
      [j - 1, j, j + 1].forEach((i) => this.leaves[i] && this.leaves[i].classList.remove('fb-far'));
      leaf.classList.add('fb-lifted');
    }

    // Animate leaf j to angle `to`; resolves once it lands.
    animate(j, to) {
      const leaf = this.leaves[j];
      const from = leaf._a ?? 0;
      this.busy = true;
      this.lift(leaf);
      leaf.style.setProperty('--fb-dur', (0.28 + 0.5 * Math.abs(to - from) / 180).toFixed(2) + 's');
      leaf.classList.add('fb-anim');
      requestAnimationFrame(() => this.set(leaf, to));
      const done = () => {
        leaf.classList.remove('fb-anim');
        this.busy = false;
        const was = this.k;
        this.k = to === 180 ? j + 1 : j;
        this.layout();
        if (this.k !== was && navigator.vibrate) navigator.vibrate(6);
        const q = this.queued; this.queued = 0;
        if (q > 0) this.next(); else if (q < 0) this.prev();
      };
      let fired = false;
      const once = (e) => {
        if (e && e.propertyName !== 'transform') return;
        if (fired) return;
        fired = true;
        leaf.removeEventListener('transitionend', once);
        done();
      };
      leaf.addEventListener('transitionend', once);
      setTimeout(once, 1200); // safety net if transitionend never fires
    }

    // Taps that land mid-turn are queued so quick tapping never feels ignored.
    next() { if (this.busy) { this.queued = 1; return; } if (this.k < this.n) this.animate(this.k, 180); }
    prev() { if (this.busy) { this.queued = -1; return; } if (this.k > 0) this.animate(this.k - 1, 0); }

    // Jump to the leaf state that shows logical page `p`.
    goTo(p) {
      const target = this.spread ? Math.ceil(p / 2) : p;
      if (target === this.k + 1) return this.next();
      if (target === this.k - 1) return this.prev();
      this.el.classList.add('fb-jump');
      this.k = clamp(target, 0, this.n);
      this.layout();
      requestAnimationFrame(() => this.el.classList.remove('fb-jump'));
    }

    bind() {
      let s = null;
      const pt = (e) => ({ x: e.clientX, y: e.clientY, t: performance.now() });
      const interactive = (t) => t.closest('a, button, input, select, textarea, [data-nodrag], [data-goto], [data-goto-house]');

      this.el.addEventListener('pointerdown', (e) => {
        if (this.busy || e.button > 0 || interactive(e.target)) return;
        s = { start: pt(e), last: pt(e), drag: null, id: e.pointerId };
      });

      this.el.addEventListener('pointermove', (e) => {
        if (!s || e.pointerId !== s.id) return;
        const p = pt(e);
        const d = this.x ? p.x - s.start.x : p.y - s.start.y;
        const cross = this.x ? p.y - s.start.y : p.x - s.start.x;
        if (!s.drag) {
          if (Math.abs(d) < 8 || Math.abs(d) < Math.abs(cross)) return;
          const fwd = d < 0;
          const j = fwd ? this.k : this.k - 1;
          if (j < 0 || j >= this.n) { s = null; return; }
          s.drag = { j, fwd, leaf: this.leaves[j] };
          this.lift(s.drag.leaf);
          try { this.el.setPointerCapture(e.pointerId); } catch (_) {}
        }
        const r = this.el.getBoundingClientRect();
        const size = (this.x ? r.width : r.height) / (this.spread ? 2 : 1);
        const prog = clamp(Math.abs(d) / (size * 0.85), 0, 1);
        const sign = s.drag.fwd ? d < 0 : d > 0;
        const p01 = sign ? prog : 0;
        this.set(s.drag.leaf, s.drag.fwd ? p01 * 180 : 180 - p01 * 180);
        s.prev = s.last; s.last = p;
        e.preventDefault();
      });

      const end = (e) => {
        if (!s || e.pointerId !== s.id) return;
        const st = s; s = null;
        if (st.drag) {
          const { j, fwd, leaf } = st.drag;
          const a = leaf._a;
          const prev = st.prev || st.start;
          const dt = Math.max(1, st.last.t - prev.t);
          const v = (this.x ? st.last.x - prev.x : st.last.y - prev.y) / dt; // px/ms
          const prog = fwd ? a / 180 : 1 - a / 180;
          const flick = fwd ? v < -0.45 : v > 0.45;
          const complete = e.type !== 'pointercancel' && (prog > 0.33 || flick);
          this.animate(j, fwd === complete ? 180 : 0);
          return;
        }
        if (e.type === 'pointercancel' || interactive(e.target)) return;
        const moved = Math.hypot(st.last.x - st.start.x, st.last.y - st.start.y);
        if (moved > 8) return;
        const r = this.el.getBoundingClientRect();
        const rel = this.x ? (e.clientX - r.left) / r.width : (e.clientY - r.top) / r.height;
        const [lo, hi] = this.spread ? [0.5, 0.5] : this.x ? [0.28, 0.62] : [0.22, 0.55];
        if (rel > hi) this.next();
        else if (rel < lo) this.prev();
      };
      this.el.addEventListener('pointerup', end);
      this.el.addEventListener('pointercancel', end);

      addEventListener('keydown', (e) => {
        if (e.target.closest && e.target.closest('input, textarea')) return;
        if (['ArrowRight', 'ArrowDown', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); this.next(); }
        if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); this.prev(); }
      });
    }
  }

  window.Flipbook = Flipbook;
})();
</script>
<script>
  const { esc, pad, hero, bike, stats, isStop, mi, gmaps, arrow, leg, routeMap, profile, hash, route: R } = MCR;
  const S = stats();
  const H = HOMES;
  const pages = [];
  const homeStart = 5;

  pages.push({ cls: 'pg cover', html: `
    <div class="cv-meta"><span>The Ridgefield Bicycle Club</span><span>New Canaan, CT</span></div>
    <div class="cv-art">${bike()}<div class="sun"></div><div class="glass"></div><div class="slab"></div></div>
    <h1 class="cv-title">Modern<em>New Canaan</em></h1>
    <p class="cv-when">Tuesday, November 10 · 10 am<br>Irwin Park, Weed Street</p>
    <p class="cv-sub">${S.count} houses by bicycle, ${S.first}–${S.last}<br>A ride hosted by Bill Adamsen</p>` });

  pages.push({ cls: 'pg intro', html: `
    <div class="eyebrow">The Ride</div>
    <h2>A town that became a <em>laboratory</em> for the modern house.</h2>
    <p>After the war, a handful of young architects, among them Philip Johnson, Marcel Breuer, Eliot Noyes and Landis Gores, settled in New Canaan and began building glass, steel and fieldstone houses in its woods.</p>
    <p>This ride threads ${S.count} of them on a ${R.distanceMi.toFixed(1)}-mile loop from Irwin Park, along Weed Street, Chichester, Ponus Ridge, Laurel and Oenoke Ridge. We stop at ${S.stops}. The rest we ride past slowly.</p>
    <div class="figs"><div><b>${S.count}</b><span>Houses</span></div><div><b>${S.stops}</b><span>Stops</span></div><div><b>${R.distanceMi.toFixed(1)}</b><span>Miles</span></div></div>
    <div class="folio"><span>Modern New Canaan</span><span>i</span></div>` });

  pages.push({ cls: 'pg index', html: `
    <div class="eyebrow">The Route, in order</div>
    <ol>${H.map((h, i) => `<li><button data-goto="${homeStart + i * 2}"><span class="no">${pad(h.order)}</span><span class="nm">${esc(h.name)}</span><span class="mi">${h.mile != null ? h.mile.toFixed(1) : ''}</span><span class="dot ${isStop(h) ? 'stop' : ''}"></span></button></li>`).join('')}</ol>
    <div class="legend"><span><i class="dot stop"></i>Stop</span><span><i class="dot"></i>Ride by</span></div>
    <div class="folio"><span>Index · miles from start</span><span>ii</span></div>` });

  pages.push({ cls: 'pg map-pg', html: `
    <div class="eyebrow">The Route</div>
    <div class="mapbox">${routeMap({ labels: true, w: 400, h: 560, pad: 22 })}</div>
    <div class="map-key"><span><i class="sq"></i>Start · Irwin Park</span><span><i class="dot stop"></i>Stop</span><span><i class="dot"></i>Ride by</span><span><i class="x">×</i>Noyes House 1, demolished</span></div>
    <div class="folio"><span>New Canaan, CT</span><span>iii</span></div>` });

  pages.push({ cls: 'pg facts', html: `
    <div class="eyebrow">The Ride</div>
    <h2>${esc(R.name)}</h2>
    <dl>
      <div><dt>Distance</dt><dd>${R.distanceMi.toFixed(1)} <small>mi</small></dd></div>
      <div><dt>Climbing</dt><dd>${R.gainFt.toLocaleString()} <small>ft</small></dd></div>
      <div><dt>Stops</dt><dd>${S.stops} <small>of ${S.count}</small></dd></div>
      <div><dt>Terrain</dt><dd style="font-size:4.4cqw;text-transform:capitalize">${esc(R.terrain)}, ${esc(R.surface)}</dd></div>
    </dl>
    ${profile({ w: 400, h: 60 })}
    <div class="prof-cap"><span>Start · Irwin Park</span><span>Elevation</span><span>Finish</span></div>
    <a class="btn" href="${R.url}" target="_blank" rel="noopener">Open the route in Ride with GPS ↗</a>
    <p class="sub">Load it on your bike computer or phone for turn-by-turn directions. Survey references point to the <a href="${R.reference.url}" target="_blank" rel="noopener">2009 New Canaan modern house survey</a> (PDF, 25 MB).</p>
    <div class="folio"><span>${esc(R.difficulty || '')} · ${esc(R.type || '')}</span><span>iv</span></div>` });

  H.forEach((h, i) => {
    pages.push({ cls: 'pg photo-pg', html: `<div class="plate">No. ${pad(h.order)}</div><div class="locator">${routeMap({ cur: h.order, w: 200, h: 250, pad: 14 })}</div>${hero(h)}` });
    const L = leg(h), first = L.cues[0];
    pages.push({ cls: 'pg text-pg', html: `
      <div class="top"><div class="num">${pad(h.order)}</div><div class="tag ${isStop(h) ? 'stop' : ''}">${isStop(h) ? 'Stop' : 'Ride by'}</div></div>
      <h2>${esc(h.name)}</h2>
      <dl class="meta"><dt>Architect</dt><dd>${esc(h.architect)}</dd><dt>Built</dt><dd>${h.year}</dd><dt>Address</dt><dd>${esc(h.address)}<a href="${gmaps(h)}" target="_blank" rel="noopener">Map ↗</a></dd><dt>Mile</dt><dd>${h.mile != null ? h.mile.toFixed(1) : '–'}${h.stopAt ? ` · stop on ${esc(h.stopAt)}` : ''}</dd></dl>
      <div class="notes"><p>${esc(h.notes)}</p></div>
      <div class="nextleg"><i>${first ? arrow(first.turn) : '↑'}</i><span>${L.next ? `Next <b>${pad(L.next.order)} ${esc(L.next.name)}</b> in ${mi(L.dist)}${first ? ` · ${esc(first.text)}` : ''}` : `<b>Finish</b> in ${mi(L.dist)}, back to Irwin Park`}</span></div>
      <div class="folio"><a href="${R.reference.url}" target="_blank" rel="noopener">Survey No. ${h.surveyId} · p. ${h.surveyPage}</a><span>${pad(h.order)} / ${S.count}</span></div>` });
  });

  pages.push({ cls: 'pg colophon', html: `
    <div class="eyebrow">Colophon</div>
    <h3>About this book</h3>
    <p>House notes are from the ride’s research sheet. Route, mileage and stops are from the <a href="${R.url}" target="_blank" rel="noopener" style="color:inherit">Ride with GPS route</a>. Survey numbers refer to the 2009 New Canaan modern house survey.</p>
    <p>Photographs are credited on each plate. Houses still awaiting a photograph are shown as drawings.</p>
    <p>All of these are private homes. Please stay on the road and enjoy them from the street.</p>
    <div class="folio"><span>Modern New Canaan</span><span>v</span></div>` });
  pages.push({ cls: 'pg finish', html: `
    <div class="eyebrow" style="color:#9C9585">Finish</div>
    <h3>Thanks for riding.</h3>
    <p>The Ridgefield Bicycle Club<br>Hosted by Bill Adamsen</p>
    ${bike()}` });
  pages.push({ cls: 'pg back-cover', html: `<div class="ring"></div><p>Modern New Canaan<br>${S.first} – ${S.last}</p>` });

  const where = document.getElementById('where');
  const track = document.getElementById('track');
  const label = (p) => {
    if (p === 0) return 'Cover';
    if (p < 3) return 'The Ride';
    if (p < homeStart) return 'The Route';
    const i = Math.floor((p - homeStart) / 2);
    if (i < H.length) return `${pad(H[i].order)} · ${H[i].name}`;
    return 'Finish';
  };

  const book = new Flipbook(document.getElementById('book'), {
    pages, axis: 'x', spread: '(min-width: 960px)',
    onChange: (b) => {
      const p = b.spread && b.k > 0 ? Math.min(b.page + 1, pages.length - 1) : b.page;
      where.textContent = label(p);
      track.style.width = (b.k / b.n * 100) + '%';
      const i = Math.floor((p - homeStart) / 2);
      hash.write(p >= homeStart && i < H.length ? H[i].order : null);
    },
  });
  const start = hash.initial;
  if (start) book.goTo(homeStart + H.findIndex((h) => h.order === start) * 2);
  addEventListener('hashchange', () => { const o = hash.read(); if (o) book.goTo(homeStart + H.findIndex((h) => h.order === o) * 2); });
  document.getElementById('next').onclick = () => book.next();
  document.getElementById('prev').onclick = () => book.prev();
  document.getElementById('book').addEventListener('click', (e) => {
    const g = e.target.closest('[data-goto]');
    if (g) book.goTo(+g.dataset.goto);
    const d = e.target.closest('[data-goto-house]');
    if (d) book.goTo(homeStart + H.findIndex((h) => h.order === +d.dataset.gotoHouse) * 2);
  });
</script>
</body>
</html>
